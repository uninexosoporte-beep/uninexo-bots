name: Bot de Cursos
on:
  schedule:
    - cron: '0 6 * * *'   # 01:00 de Perú
  workflow_dispatch:
    inputs:
      forzar:
        description: "Correr aunque hoy ya haya corrido (para probar)"
        type: boolean
        default: false
concurrency: { group: bot-cursos, cancel-in-progress: false }
permissions:
  contents: write   # para guardar la memoria del bot en el repositorio
jobs:
  correr:
    uses: ./.github/workflows/_correr-bot.yml
    with: { carpeta: cursos, argumentos: "${{ inputs.forzar && '--forzar' || '' }}" }
    secrets: inherit
