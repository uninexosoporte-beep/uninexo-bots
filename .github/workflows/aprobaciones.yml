name: Cursos aprobados en Telegram
on:
  schedule:
    - cron: '30 */2 * * *'   # cada 2 horas: lee tus toques ✅/❌ y publica lo aprobado
  workflow_dispatch:
  push:   # también al subir cambios (sirve de prueba rápida); los commits de memoria de los bots no lo disparan
    branches: [main]
concurrency: { group: bot-cursos, cancel-in-progress: false }
permissions:
  contents: write   # para guardar la memoria del bot en el repositorio
jobs:
  correr:
    uses: ./.github/workflows/_correr-bot.yml
    with: { carpeta: cursos, argumentos: '--aprobaciones', minutos: 15 }
    secrets: inherit
